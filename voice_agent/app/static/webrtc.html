<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语音助手 · WebRTC</title>
<style>
  :root {
    --fog: #e4e8ee;
    --panel: #f4f6f9;
    --ink: #172033;
    --muted: #6b778c;
    --rule: #cdd3dc;
    --user: #2e55d0;   /* left channel: you */
    --bot: #0e8a6e;    /* right channel: the assistant */
    --flare: #d9481c;  /* interrupts and errors */
    --think: #6a4fc9;  /* the background thinker */
    --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fog); color: var(--ink); font: 15px/1.6 var(--sans); }
  main { max-width: 1080px; margin: 0 auto; padding: 32px 24px 48px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: .02em; }
  h1 small { font: 500 13px var(--mono); color: var(--muted); letter-spacing: .08em; margin-left: 10px; }
  .status { font: 500 13px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }
  .status[data-state="live"] { color: var(--ink); }
  .status[data-state="live"]::before { background: var(--bot); box-shadow: 0 0 0 4px rgb(14 138 110 / .15); }
  .status[data-state="connecting"]::before { background: var(--user); }
  .status[data-state="error"] { color: var(--flare); }
  .status[data-state="error"]::before { background: var(--flare); }

  /* the two-track timeline: left channel above, right channel below, newest on the right */
  .deck { margin-top: 24px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .lane { display: grid; grid-template-columns: 132px 1fr; align-items: stretch; }
  .lane + .lane { border-top: 1px dashed var(--rule); }
  .lane-label { padding: 14px 16px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; justify-content: center; }
  .lane-label b { font-size: 17px; font-weight: 600; }
  .lane-label span { font: 11px var(--mono); color: var(--muted); letter-spacing: .04em; }
  .lane-label i { font: normal 500 11px var(--mono); margin-top: 6px; height: 16px; letter-spacing: .04em; }
  .lane[data-lane="user"] .lane-label b, .lane[data-lane="user"] .lane-label i { color: var(--user); }
  .lane[data-lane="bot"] .lane-label b, .lane[data-lane="bot"] .lane-label i { color: var(--bot); }
  canvas { display: block; width: 100%; height: 96px; }
  .ruler { display: grid; grid-template-columns: 132px 1fr; border-top: 1px solid var(--rule); font: 11px var(--mono); color: var(--muted); }
  .ruler div:last-child { display: flex; justify-content: space-between; padding: 4px 8px; }

  .controls { margin-top: 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  button { font: 600 16px var(--sans); color: #fff; background: var(--ink); border: 0; border-radius: 999px; padding: 12px 28px; cursor: pointer; min-width: 132px; }
  button[data-live="true"] { background: var(--flare); }
  button:disabled { opacity: .5; cursor: progress; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--user); outline-offset: 3px; }
  fieldset { border: 0; margin: 0; padding: 0; display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  fieldset:disabled { opacity: .55; }
  legend { float: left; margin-right: 4px; font: 11px var(--mono); letter-spacing: .06em; padding-top: 2px; }
  label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  input[type="checkbox"] { accent-color: var(--ink); }
  .mode { gap: 10px; font: 600 14px var(--sans); }
  select { font: 500 15px var(--sans); color: var(--ink); background: #fff; border: 1px solid var(--rule); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
  select:disabled { opacity: .55; cursor: default; }
  select:focus-visible { outline: 3px solid var(--user); outline-offset: 3px; }

  .panels { margin-top: 28px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .panels[data-history="off"] { grid-template-columns: minmax(0, 1fr); }
  .panels[data-history="off"] .history { display: none; }
  .log h2, .history h2 { font: 600 13px var(--mono); letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
  ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); max-height: 420px; overflow: auto; font: 13px/1.5 var(--mono); }
  li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 6px 2px; border-bottom: 1px solid var(--rule); }
  li time { color: var(--muted); }
  li[data-kind="user"] span { color: var(--user); }
  li[data-kind="bot"] span { color: var(--bot); }
  li[data-kind="interrupt"] span, li[data-kind="error"] span { color: var(--flare); font-weight: 600; }
  li.empty { display: block; color: var(--muted); font-family: var(--sans); padding: 14px 2px; }

  /* per-turn latency: speech end → first audio, split by pipeline stage */
  .header-right { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .latency-chip { font: 500 13px var(--mono); color: var(--muted); }
  .latency-chip b { color: var(--ink); font-weight: 600; }
  .lat { display: flex; flex-direction: column; gap: 5px; }
  .lat-bar { width: min(100%, 480px); height: 8px; border-radius: 4px; background: #e9ecf1; overflow: hidden; }
  .lat-fill { display: flex; height: 100%; max-width: 100%; }
  .lat-fill i { display: block; height: 100%; }
  .lat-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .lat-legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--c); }
  li[data-kind="latency"] .lat-total { color: var(--ink); font-weight: 600; }

  /* conversation history: what the LLM will see next turn */
  .history .hint { font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
  .chat { border-top: 1px solid var(--rule); max-height: 420px; overflow: auto; padding: 10px 2px 4px; display: flex; flex-direction: column; gap: 10px; }
  .chat .empty { color: var(--muted); font-size: 13px; padding: 4px 0; }
  .msg { max-width: 88%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: rgb(46 85 208 / .1); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: rgb(14 138 110 / .1); border-bottom-left-radius: 4px; }
  .msg.bot.cut { background: rgb(217 72 28 / .07); }
  .msg.bot.pending { background: transparent; border: 1px dashed var(--rule); color: var(--muted); }
  .msg del { color: var(--muted); text-decoration-color: var(--flare); }
  .msg .meta { display: block; margin-top: 4px; font: 11px var(--mono); color: var(--muted); letter-spacing: .02em; }
  .msg.user .meta { text-align: right; }

  /* background tasks (stfr mode): what the thinker is doing, step by step, in a sidebar on wide screens */
  main[data-tasks="on"] { max-width: 1680px; display: grid; grid-template-columns: minmax(0, 1fr) clamp(340px, 28vw, 460px); column-gap: 32px; align-items: start;
          grid-template-rows: auto auto auto 1fr; }  /* header, timeline, controls, panels: a tall sidebar only stretches the last */
  main[data-tasks="on"] > * { grid-column: 1; }
  main[data-tasks="on"] > .tasks { grid-column: 2; grid-row: 1 / -1; position: sticky; top: 16px; margin-top: 0;
          max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
  main[data-tasks="on"] .task-list { grid-template-columns: minmax(0, 1fr); overflow: auto; min-height: 0; flex: 1 1 auto; padding-right: 4px; }
  main[data-tasks="on"] .panels { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .tasks { margin-top: 28px; }
  .tasks[hidden] { display: none; }
  .tasks-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .tasks-head h2 { font: 600 13px var(--mono); letter-spacing: .08em; color: var(--muted); margin: 0; }
  .tasks-head h2 b { color: var(--think); font-weight: 600; }
  .tasks-count { font: 12px var(--mono); color: var(--muted); }
  .tasks-count b { color: var(--think); }
  .task-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; border-top: 1px solid var(--rule); padding-top: 14px; }
  .task-list .empty { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
  .task { position: relative; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px 12px; overflow: hidden;
          animation: task-in .35s ease-out; }
  .task::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--rule); }
  .task[data-status="running"] { border-color: rgb(106 79 201 / .45); box-shadow: 0 0 0 3px rgb(106 79 201 / .08); }
  .task[data-status="running"]::before { background: linear-gradient(90deg, transparent, var(--think), transparent); background-size: 40% 100%;
          background-repeat: no-repeat; animation: scan 1.4s linear infinite; }
  .task[data-status="done"]::before { background: var(--think); }
  .task[data-status="done"][data-reported="true"]::before { background: var(--bot); }
  .task[data-status="failed"]::before { background: var(--flare); }
  .task[data-status="cancelled"] { opacity: .6; }
  .task-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font: 11px var(--mono); color: var(--muted); letter-spacing: .04em; }
  .task-top .state { color: var(--think); font-weight: 600; }
  .task[data-status="done"][data-reported="true"] .state { color: var(--bot); }
  .task[data-status="failed"] .state { color: var(--flare); }
  .task[data-status="cancelled"] .state { color: var(--muted); }
  .task-q { margin: 6px 0 10px; font-size: 15px; font-weight: 600; line-height: 1.45; }
  .task[data-status="cancelled"] .task-q { text-decoration: line-through; text-decoration-color: var(--muted); }
  .steps { list-style: none; margin: 0; padding: 0 0 0 14px; border: 0; max-height: none; overflow: visible; position: relative; font: 12px/1.5 var(--mono); }
  .steps::before { content: ""; position: absolute; left: 3px; top: 6px; bottom: 6px; width: 1px; background: var(--rule); }
  .steps li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 3px 0; border: 0; position: relative; animation: task-in .3s ease-out; }
  .steps li::before { content: ""; position: absolute; left: -14px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--think); }
  .steps li[data-done="false"]::before { animation: pulse 1s ease-in-out infinite; }
  .steps li[data-done="true"]::before { background: var(--panel); border: 1.5px solid var(--think); width: 4px; height: 4px; }
  .steps .tool { color: var(--think); font-weight: 600; letter-spacing: .04em; }
  .steps .arg { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-result { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--rule); font-size: 13px; line-height: 1.6; white-space: pre-wrap;
          word-break: break-word; max-height: 168px; overflow: auto; animation: task-in .4s ease-out; }
  .task-result .lead { display: block; font-weight: 600; margin-bottom: 2px; }
  .task-result .more { color: var(--muted); }
  .task[data-status="failed"] .task-result { color: var(--flare); }
  li[data-kind="think"] span { color: var(--think); }
  @keyframes scan { from { background-position: -40% 0; } to { background-position: 140% 0; } }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
  @keyframes task-in { from { opacity: 0; transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) {
    .task, .steps li, .task-result, .task[data-status="running"]::before, .steps li[data-done="false"]::before { animation: none; }
    .task[data-status="running"]::before { background: var(--think); }
  }

  @media (max-width: 1100px) {
    main[data-tasks="on"] { display: block; max-width: 1080px; }
    main[data-tasks="on"] > .tasks { position: static; max-height: none; margin-top: 28px; }
    main[data-tasks="on"] .task-list { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); overflow: visible; }
  }

  @media (max-width: 640px) {
    main { padding: 20px 14px 32px; }
    .lane, .ruler { grid-template-columns: 84px 1fr; }
    .lane-label { padding: 10px; }
    .lane-label span { display: none; }
    li { grid-template-columns: 72px 1fr; }
    .panels { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1><span id="title">语音助手</span><small id="subtitle">WEBRTC · CHATBOT</small></h1>
    <div class="header-right">
      <div class="latency-chip" id="latency-chip" title="你说完到听到第一个字，服务端测得" hidden></div>
      <div class="status" id="status" data-state="idle" role="status">未连接</div>
    </div>
  </header>

  <section class="deck" aria-label="实时双轨时间线">
    <div class="lane" data-lane="user">
      <div class="lane-label"><b>你</b><span>麦克风 · 左声道</span><i id="user-state"></i></div>
      <canvas id="user-track" aria-hidden="true"></canvas>
    </div>
    <div class="lane" data-lane="bot">
      <div class="lane-label"><b id="bot-name">助手</b><span>播放 · 右声道</span><i id="bot-state"></i></div>
      <canvas id="bot-track" aria-hidden="true"></canvas>
    </div>
    <div class="ruler"><div></div><div><span>−10s</span><span>−5s</span><span>现在</span></div></div>
  </section>

  <div class="controls">
    <label class="mode">模式
      <select id="mode">
        <option value="chatbot">聊天</option>
        <option value="simple_chat">本地聊天（MLX Gemma 4 E2B）</option>
        <option value="translator">实时翻译（中 → 英）</option>
        <option value="stfr">快答慢想（后台任务）</option>
      </select>
    </label>
    <button id="call" type="button">开始通话</button>
    <fieldset id="mic-options">
      <legend>浏览器麦克风处理</legend>
      <label><input type="checkbox" id="opt-aec" checked>回声消除</label>
      <label><input type="checkbox" id="opt-ns" checked>降噪</label>
      <label><input type="checkbox" id="opt-agc">自动增益</label>
    </fieldset>
  </div>

  <section class="tasks" id="tasks" aria-labelledby="tasks-title" hidden>
    <div class="tasks-head">
      <h2 id="tasks-title">后台 · <b>THINKER</b></h2>
      <span class="tasks-count" id="tasks-count" aria-live="polite"></span>
    </div>
    <div class="task-list" id="task-list"><div class="empty">让助手查点东西，比如“这周末上海有什么展览”。后台每一步在查什么、读了哪一页，都会实时显示在这里。</div></div>
  </section>

  <div class="panels" id="panels">
    <section class="history" aria-labelledby="history-title">
      <h2 id="history-title">对话历史</h2>
      <p class="hint">大模型下一轮看到的就是这些。划掉的是生成了、但你没听到的部分，不进历史。</p>
      <div class="chat" id="chat"><div class="empty">开始聊天后，这里显示对话历史。</div></div>
    </section>
    <section class="log">
      <h2>事件</h2>
      <ol id="log"><li class="empty">开始通话后，开口、停口、开始播放、播完、打断，都会记在这里，也会标在上面的时间线上。</li></ol>
    </section>
  </div>

  <audio id="remote" autoplay></audio>
</main>

<script>
const WINDOW_MS = 10000;
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const COLORS = { user: css("--user"), bot: css("--bot"), flare: css("--flare"), rule: css("--rule") };
const MONO = css("--mono");

let pc = null, channel = null, micStream = null, audioCtx = null, startedAt = 0, timer = null;
const meters = { user: null, bot: null };   // AnalyserNodes
const levels = { user: [], bot: [] };       // [{t, v}]
const marks = [];                           // [{t, lane, kind, label}]

function setStatus(state, text) { const el = $("status"); el.dataset.state = state; el.textContent = text; }
function laneState(lane, text) { $(`${lane}-state`).textContent = text; }

function log(kind, text) {
  const list = $("log");
  list.querySelector(".empty")?.remove();
  const li = document.createElement("li");
  li.dataset.kind = kind;
  const time = document.createElement("time");
  time.textContent = startedAt ? `+${((performance.now() - startedAt) / 1000).toFixed(2)}s` : "";
  const span = document.createElement("span");
  span.textContent = text;
  li.append(time, span);
  list.prepend(li);
}

function mark(lane, kind, label) { marks.push({ t: performance.now(), lane, kind, label }); }

const MODES = {
  chatbot: { title: "语音助手", subtitle: "WEBRTC · CHATBOT", bot: "助手", reply: "回答", history: true },
  simple_chat: { title: "本地聊天", subtitle: "WEBRTC · MLX GEMMA 4 E2B", bot: "助手", reply: "回答", history: true },
  translator: { title: "实时翻译", subtitle: "WEBRTC · 中 → 英", bot: "译文", reply: "翻译", history: false },
  stfr: { title: "快答慢想", subtitle: "WEBRTC · FAST RESPONDER · SLOW THINKER", bot: "助手", reply: "回答", history: true, tasks: true },
};
const mode = () => MODES[$("mode").value];

function applyMode() {
  const m = mode();
  $("title").textContent = m.title;
  $("subtitle").textContent = m.subtitle;
  $("bot-name").textContent = m.bot;
  $("panels").dataset.history = m.history ? "on" : "off";
  $("tasks").hidden = !m.tasks;
  document.querySelector("main").dataset.tasks = m.tasks ? "on" : "off";
  document.title = `${m.title} · WebRTC`;
  localStorage.setItem("webrtc:mode", $("mode").value);
}
$("mode").value = new URLSearchParams(location.search).get("mode") || localStorage.getItem("webrtc:mode") || "chatbot";
if (!MODES[$("mode").value]) $("mode").value = "chatbot";
$("mode").onchange = applyMode;
applyMode();

const EVENTS = {
  user_started_speaking: (e) => { laneState("user", "说话中"); mark("user", "start"); log("user", `你开口了 #${e.utterance_id}`); },
  user_stopped_speaking: (e) => { laneState("user", ""); mark("user", "stop"); log("user", e.utterance_id == null ? "你停口了（太短，没当成一句话）" : `你停口了 #${e.utterance_id}`); },
  bot_started_speaking: (e) => { laneState("bot", "说话中"); mark("bot", "start"); log("bot", `${mode().bot}开始播放，${mode().reply} #${e.utterance_id}`); },
  bot_stopped_speaking: () => { laneState("bot", ""); mark("bot", "stop"); },
  reply_end: (e) => log("bot", `${mode().bot}播完了，${mode().reply} #${e.utterance_id}`),
  interrupt: (e) => { laneState("bot", ""); mark("both", "interrupt", "打断"); log("interrupt", `打断了对 #${e.utterance_id} 的${mode().reply}`); },
  stop: () => { log("bot", "服务端结束了通话"); hangUp(false); },
  latency: (e) => showLatency(e),
  conversation: (e) => renderConversation(e.turns),
  tasks: (e) => renderTasks(e.tasks),
  bot_spoke: (e) => {
    // what the user actually heard of the reply: this is what goes into the conversation history
    if (!e.sentences) return;  // the TTS did not say which text it played
    const heard = e.sentences.filter(([, f]) => f >= 0.999).map(([t]) => t).join("");
    if (!e.interrupted) return log("bot", `${mode().bot}说的：${heard}`);
    log("interrupt", `${mode().bot}被打断，听到 ${e.sentences.filter(([, f]) => f >= 0.999).length}/${e.sentences.length} 句：${heard || "（一句都没说完）"}`);
  },
};

/* ---------- conversation history: what the LLM sees next turn ---------- */
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function renderConversation(turns) {
  const chat = $("chat");
  const stick = chat.scrollTop + chat.clientHeight >= chat.scrollHeight - 8;
  chat.innerHTML = "";
  if (!turns.length) chat.append(el("div", "empty", "开始聊天后，这里显示对话历史。"));
  turns.forEach((t, i) => {
    const user = el("div", "msg user", t.user);
    // the LLM gets an unanswered turn together with the next one, as one user message
    const merged = t.reported && !t.said && i < turns.length - 1;
    user.append(el("span", "meta", `#${t.utterance_id}${merged ? " · 没被回答，和下一句合并发给大模型" : ""}`));
    chat.append(user);

    const bot = el("div", "msg bot");
    if (!t.reported && !t.generated) {
      bot.classList.add("pending");
      bot.append("思考中…");
    } else if (!t.reported) {
      bot.classList.add("pending");
      bot.append(t.generated, el("span", "meta", "生成完，等待播放结果"));
    } else {
      const heard = t.heard ?? t.said ?? "";
      const unheard = t.generated && t.generated.startsWith(heard) ? t.generated.slice(heard.length) : (t.interrupted ? t.generated : "");
      if (t.interrupted) bot.classList.add("cut");
      if (heard) bot.append(heard);
      if (unheard && unheard.trim()) bot.append(el("del", null, unheard));
      const meta = !t.interrupted ? "播完" : heard ? "被打断，只记听到的部分" : "被打断，一句都没听到，不进历史";
      bot.append(el("span", "meta", meta));
    }
    chat.append(bot);
  });
  if (stick) chat.scrollTop = chat.scrollHeight;
}

/* ---------- background tasks: one card per task, updated in place so animations play once ---------- */
const TOOLS = {
  get_current_time: ["TIME", () => "看一下现在的时间"],
  web_search: ["SEARCH", (a) => a.query],
  web_fetch: ["READ", (a) => a.url.replace(/^https?:\/\//, "")],
};
const cards = new Map();   // task id -> {card, last: snapshot}
let taskTicker = null;

function taskState(t) {
  if (t.status === "running") return "正在查";
  if (t.status === "failed") return "没查到";
  if (t.status === "cancelled") return "已取消";
  return t.reported ? "已告诉你" : "查到了，等助手开口";
}

function secs(t) {
  const end = t.finished ?? Date.now() / 1000;
  return Math.max(0, end - t.started).toFixed(1);
}

function renderResult(t) {
  const box = el("div", "task-result");
  if (t.status === "failed") { box.textContent = t.error; return box; }
  const [lead, ...rest] = (t.result || "").split("\n");
  box.append(el("span", "lead", lead));
  if (rest.length) box.append(el("span", "more", rest.join("\n").trim()));
  return box;
}

function renderTasks(tasks) {
  const list = $("task-list");
  if (tasks.length) list.querySelector(".empty")?.remove();
  const running = tasks.filter((t) => t.status === "running").length;
  $("tasks-count").innerHTML = tasks.length ? `<b>${running}</b> 个在查 · 共 ${tasks.length} 个` : "";

  for (const t of tasks) {
    let entry = cards.get(t.id);
    if (!entry) {
      const card = el("article", "task");
      const top = el("div", "task-top");
      top.append(el("span", "state"), el("span", "clock"));
      card.append(top, el("div", "task-q", t.instruction), el("ol", "steps"));
      list.prepend(card);   // newest first
      entry = { card, last: null };
      cards.set(t.id, entry);
      log("think", `后台开始查：${t.instruction}`);
    }
    const { card, last } = entry;
    card.dataset.status = t.status;
    card.dataset.reported = t.reported;
    card.dataset.started = t.started;
    card.dataset.finished = t.finished ?? "";
    card.querySelector(".state").textContent = `#${t.id} · ${taskState(t)}`;
    card.querySelector(".clock").textContent = `${secs(t)}s · ${t.steps.length} 步`;

    const steps = card.querySelector(".steps");
    t.steps.forEach((s, i) => {
      let li = steps.children[i];
      if (!li) {
        const [tag, describe] = TOOLS[s.tool] || [s.tool.toUpperCase(), (a) => JSON.stringify(a)];
        li = el("li");
        const arg = el("span", "arg", describe(s.args || {}));
        arg.title = arg.textContent;
        li.append(el("span", "tool", tag), arg);
        steps.append(li);
      }
      li.dataset.done = s.done;
    });

    if (t.status !== "running" && !card.querySelector(".task-result") && t.status !== "cancelled") {
      card.append(renderResult(t));
    }
    if (last && last.status === "running" && t.status !== "running") {
      log("think", t.status === "done" ? `后台查到了 #${t.id}，用时 ${secs(t)}s` : `后台 #${t.id} ${taskState(t)}`);
    }
    if (last && !last.reported && t.reported && t.status === "done") log("think", `助手说了 #${t.id} 的结果`);
    entry.last = t;
  }

  if (running && !taskTicker) {
    taskTicker = setInterval(() => {
      let any = false;
      for (const { card, last } of cards.values()) {
        if (last.status !== "running") continue;
        any = true;
        card.querySelector(".clock").textContent = `${secs(last)}s · ${last.steps.length} 步`;
      }
      if (!any) { clearInterval(taskTicker); taskTicker = null; }
    }, 100);
  }
}

function resetTasks() {
  cards.clear();
  clearInterval(taskTicker);
  taskTicker = null;
  $("tasks-count").textContent = "";
  $("task-list").innerHTML = "";
  $("task-list").append(el("div", "empty", "让助手查点东西，比如“这周末上海有什么展览”。后台每一步在查什么、读了哪一页，都会实时显示在这里。"));
}

/* ---------- latency: speech end → first audio ---------- */
const STAGE_COLORS = { VAD: "#d0c4ae", STT: COLORS.user, turn: "#b7791f", LLM: "#172033", TTS: COLORS.bot, out: "#8f99ab" };
const STAGE_LABELS = { VAD: "VAD 静音等待", STT: "识别", turn: "轮次判断", LLM: "大模型首句", TTS: "合成首包", out: "播出" };
const BAR_SCALE_SECS = 3;  // a full bar: every turn on the same scale, so they compare at a glance
let latencyTotals = [];

function median(values) {
  const v = [...values].sort((a, b) => a - b), m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
}

function showLatency(e) {
  latencyTotals.push(e.total);
  const chip = $("latency-chip");
  chip.hidden = false;
  chip.innerHTML = "";
  chip.append("首音延迟 ", Object.assign(document.createElement("b"), { textContent: `${e.total.toFixed(2)}s` }),
    ` · 中位 ${median(latencyTotals).toFixed(2)}s（${latencyTotals.length} 轮）`);

  const list = $("log");
  list.querySelector(".empty")?.remove();
  const li = document.createElement("li");
  li.dataset.kind = "latency";
  const time = document.createElement("time");
  time.textContent = startedAt ? `+${((performance.now() - startedAt) / 1000).toFixed(2)}s` : "";
  const body = document.createElement("div");
  body.className = "lat";
  const head = document.createElement("div");
  head.append(`#${e.utterance_id} 说完 → 听到第一个字 `, Object.assign(document.createElement("span"), { className: "lat-total", textContent: `${e.total.toFixed(2)}s` }));
  const bar = document.createElement("div");
  bar.className = "lat-bar";
  bar.title = `满格 ${BAR_SCALE_SECS}s`;
  const fill = document.createElement("div");
  fill.className = "lat-fill";
  fill.style.width = `${Math.min(100, (e.total / BAR_SCALE_SECS) * 100)}%`;
  bar.append(fill);
  const legend = document.createElement("div");
  legend.className = "lat-legend";
  for (const [name, secs] of e.stages) {
    const color = STAGE_COLORS[name] || "#999";
    const seg = document.createElement("i");
    seg.style.flex = `${Math.max(secs, 0)} 0 0`;
    seg.style.background = color;
    seg.title = `${STAGE_LABELS[name] || name} ${secs.toFixed(2)}s`;
    fill.append(seg);
    const item = document.createElement("span");
    item.style.setProperty("--c", color);
    item.textContent = `${STAGE_LABELS[name] || name} ${secs.toFixed(2)}s`;
    legend.append(item);
  }
  body.append(head, bar, legend);
  li.append(time, body);
  list.prepend(li);
}

function meter(stream) {
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  audioCtx.createMediaStreamSource(stream).connect(analyser);
  return analyser;
}

function rms(analyser) {
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  let sum = 0;
  for (const x of buf) sum += x * x;
  return Math.min(1, Math.sqrt(sum / buf.length) * 4);
}

function draw(now) {
  for (const lane of ["user", "bot"]) {
    const canvas = $(`${lane}-track`);
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== w * dpr || canvas.height !== h * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (meters[lane]) levels[lane].push({ t: now, v: rms(meters[lane]) });
    while (levels[lane].length && levels[lane][0].t < now - WINDOW_MS) levels[lane].shift();

    const x = (t) => w - ((now - t) / WINDOW_MS) * w;
    ctx.strokeStyle = COLORS.rule;
    ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();

    ctx.fillStyle = COLORS[lane];
    for (const { t, v } of levels[lane]) {
      const barH = Math.max(1, v * (h - 12));
      ctx.fillRect(x(t), (h - barH) / 2, 2, barH);
    }

    for (const m of marks) {
      if (m.t < now - WINDOW_MS || (m.lane !== lane && m.lane !== "both")) continue;
      const mx = Math.round(x(m.t)) + 0.5;
      if (m.kind === "interrupt") {
        ctx.strokeStyle = COLORS.flare; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(mx, 0); ctx.lineTo(mx, h); ctx.stroke(); ctx.lineWidth = 1;
        if (lane === "user") { ctx.fillStyle = COLORS.flare; ctx.font = `600 11px ${MONO}`; ctx.fillText(m.label, mx + 4, 13); }
      } else {
        ctx.strokeStyle = COLORS[lane];
        ctx.setLineDash(m.kind === "stop" ? [3, 3] : []);
        ctx.beginPath(); ctx.moveTo(mx, 4); ctx.lineTo(mx, h - 4); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }
  while (marks.length && marks[0].t < now - WINDOW_MS) marks.shift();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function waitForIce(peer) {
  if (peer.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((resolve) => {
    const done = () => { if (peer.iceGatheringState === "complete") { peer.removeEventListener("icegatheringstatechange", done); resolve(); } };
    peer.addEventListener("icegatheringstatechange", done);
    setTimeout(resolve, 2000);  // host candidates are enough on a local network
  });
}

async function call() {
  const button = $("call");
  button.disabled = true;
  setStatus("connecting", "连接中…");
  $("mode").disabled = true;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: $("opt-aec").checked,
        noiseSuppression: $("opt-ns").checked,
        autoGainControl: $("opt-agc").checked,
      },
    });
  } catch (err) {
    setStatus("error", "没有麦克风权限");
    log("error", `拿不到麦克风（${err.name}）：在地址栏左侧允许使用麦克风，再点开始通话。页面需要用 localhost 或 https 打开。`);
    button.disabled = false;
    $("mode").disabled = false;
    return;
  }

  audioCtx = new AudioContext();
  meters.user = meter(micStream);

  pc = new RTCPeerConnection();
  micStream.getTracks().forEach((track) => pc.addTrack(track, micStream));
  pc.ontrack = (e) => {
    const stream = e.streams[0] || new MediaStream([e.track]);
    $("remote").srcObject = stream;
    meters.bot = meter(stream);
  };
  pc.onconnectionstatechange = () => {
    if (pc?.connectionState === "connected") {
      startedAt = performance.now();
      latencyTotals = [];
      renderConversation([]);
      resetTasks();
      setStatus("live", "通话中 0:00");
      timer = setInterval(() => {
        const s = Math.floor((performance.now() - startedAt) / 1000);
        setStatus("live", `通话中 ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`);
      }, 1000);
      log("user", "已接通，可以说话了");
    } else if (pc && ["failed", "disconnected"].includes(pc.connectionState)) {
      setStatus("error", "连接断开");
      log("error", `连接断开（${pc.connectionState}）。如果开着代理的 TUN 模式，先关掉再试。`);
      hangUp(false);
    }
  };

  channel = pc.createDataChannel("events");
  channel.onmessage = (e) => {
    const event = JSON.parse(e.data);
    (EVENTS[event.event_type] || ((ev) => log("bot", ev.event_type)))(event);
  };

  try {
    await pc.setLocalDescription(await pc.createOffer());
    await waitForIce(pc);
    const res = await fetch(`${location.pathname.replace(/\/$/, "")}/${$("mode").value}/offer`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
    });
    if (!res.ok) throw new Error(`服务端返回 ${res.status}：${await res.text()}`);
    await pc.setRemoteDescription(await res.json());
  } catch (err) {
    setStatus("error", "连接失败");
    log("error", `连接失败：${err.message}`);
    hangUp(false);
    return;
  }

  button.textContent = "挂断";
  button.dataset.live = "true";
  button.disabled = false;
  $("mic-options").disabled = true;
  $("mode").disabled = true;
}

function hangUp(tellServer = true) {
  if (tellServer && channel?.readyState === "open") channel.send(JSON.stringify({ event_type: "stop" }));
  clearInterval(timer);
  pc?.close(); pc = null; channel = null;
  micStream?.getTracks().forEach((t) => t.stop()); micStream = null;
  audioCtx?.close(); audioCtx = null;
  meters.user = meters.bot = null;
  laneState("user", ""); laneState("bot", "");
  if ($("status").dataset.state !== "error") setStatus("idle", startedAt ? "已挂断" : "未连接");
  startedAt = 0;
  const button = $("call");
  button.textContent = "开始通话";
  button.dataset.live = "false";
  button.disabled = false;
  $("mic-options").disabled = false;
  $("mode").disabled = false;
}

$("call").addEventListener("click", () => (pc ? hangUp() : call()));
</script>
</body>
</html>
