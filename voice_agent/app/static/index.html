<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实时语音</title>
<style>
  :root {
    --fog: #e4e8ee;
    --ink: #172033;
    --ink-2: #222d44;
    --muted: #8d97ab;
    --line: #2f3a52;
    --jade: #0e8a6e;
    --live: #2bc49a;
    --cobalt: #2e55d0;
    --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fog); font: 15px/1.5 var(--sans); }
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100vh; }

  nav { background: var(--ink); color: #fff; display: flex; flex-direction: column; padding: 22px 14px 16px; gap: 18px; }
  .brand { padding: 0 10px; }
  .brand b { display: block; font-size: 18px; font-weight: 600; letter-spacing: .02em; }
  .brand small { font: 11px var(--mono); color: var(--muted); letter-spacing: .08em; }
  .tabs { display: flex; flex-direction: column; gap: 4px; }
  .tab { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 10px 12px; border-radius: 10px; color: #c9d0dd; text-decoration: none; }
  .tab:hover { background: var(--ink-2); color: #fff; }
  .tab[aria-current="page"] { background: #fff; color: var(--ink); }
  .tab-title { font-weight: 600; }
  .tab-desc { grid-column: 1; font-size: 12px; color: var(--muted); }
  .tab[aria-current="page"] .tab-desc { color: #6b778c; }
  .tab-state { grid-row: 1 / span 2; grid-column: 2; display: none; align-items: center; gap: 6px; font-size: 11px; color: var(--live); }
  .tab-state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 3px rgb(43 196 154 / .22); }
  .tab[aria-current="page"] .tab-state { color: var(--jade); }
  .tab[data-live="true"] .tab-state { display: inline-flex; }
  .tab:focus-visible, .foot a:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
  .foot { margin-top: auto; padding: 0 12px; font-size: 12px; }
  .foot a { color: var(--muted); text-decoration: none; }
  .foot a:hover { color: #fff; }

  .stage { position: relative; min-width: 0; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--fog); }
  .stage iframe[hidden] { display: none; }

  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    nav { flex-direction: row; align-items: center; padding: 10px 12px; gap: 12px; overflow-x: auto; }
    .brand small, .tab-desc, .foot { display: none; }
    .tabs { flex-direction: row; }
    .tab { padding: 6px 12px; white-space: nowrap; }
    .tab-state { grid-row: 1; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav aria-label="页面">
    <div class="brand"><b>实时语音</b><small>VOICE AGENT</small></div>
    <div class="tabs" id="tabs"></div>
    <div class="foot"><a href="/docs" target="_blank" rel="noopener">API 文档 ↗</a></div>
  </nav>
  <main class="stage" id="stage"></main>
</div>

<script>
// One entry per page. A new page is one more line here; `busy` tells, from the page itself (same origin),
// whether it is doing something worth showing on the tab while you look at another one.
const PAGES = [
  {
    id: "agent", title: "Voice Agent", desc: "聊天 · 翻译", src: "/webrtc",
    busy: (doc) => doc.getElementById("status")?.dataset.state === "live" && "通话中",
  },
  {
    id: "clone", title: "声音复刻", desc: "我的音色 · 复刻", src: "/voice_clone",
    busy: (doc) => doc.getElementById("rec")?.dataset.state === "recording" && "录音中",
  },
];

const tabs = document.getElementById("tabs");
const stage = document.getElementById("stage");
const frames = {};  // created on first visit, then kept: switching tabs never ends a call or a recording

for (const p of PAGES) {
  const a = document.createElement("a");
  a.className = "tab";
  a.href = `#${p.id}`;
  a.dataset.id = p.id;
  a.innerHTML = `<span class="tab-title"></span><span class="tab-state"></span><span class="tab-desc"></span>`;
  a.querySelector(".tab-title").textContent = p.title;
  a.querySelector(".tab-desc").textContent = p.desc;
  tabs.append(a);
}

function show(id) {
  const page = PAGES.find((p) => p.id === id) || PAGES[0];
  if (!frames[page.id]) {
    const frame = document.createElement("iframe");
    frame.src = page.src;
    frame.title = page.title;
    frame.allow = "microphone; autoplay";
    stage.append(frame);
    frames[page.id] = frame;
  }
  for (const [pid, frame] of Object.entries(frames)) frame.hidden = pid !== page.id;
  for (const a of tabs.children) {
    if (a.dataset.id === page.id) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  }
  document.title = `${page.title} · 实时语音`;
  localStorage.setItem("shell:page", page.id);
}

window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1) || localStorage.getItem("shell:page") || PAGES[0].id);

setInterval(() => {
  for (const p of PAGES) {
    let state = false;
    try { state = frames[p.id] && p.busy(frames[p.id].contentDocument); } catch { /* page still loading */ }
    const a = tabs.querySelector(`[data-id="${p.id}"]`);
    a.dataset.live = String(Boolean(state));
    a.querySelector(".tab-state").textContent = state || "";
  }
}, 1000);
</script>
</body>
</html>
